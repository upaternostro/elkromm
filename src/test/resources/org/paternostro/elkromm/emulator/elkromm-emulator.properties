org.paternostro.elkromm.emulator.Config.class=org.paternostro.elkromm.emulator.InjectableConfig

# One keypad and one reader, so the tests that need them run instead of being skipped:
# ElkrommFacadeFunctionalTest.testKeyboards, testSetKeyboard, testReaders and testSetReader
org.paternostro.elkromm.emulator.keyboards=1
org.paternostro.elkromm.emulator.readers=1

# WARNING: the default configuration of an input is now NOT_USED.
# This way, the emulator does not track any input, so the following tests would fail:
#
# ElkrommFacadeFunctionalTest.testRawInputStatus needs at least one input
# ElkrommFacadeFunctionalTest.testExcludeIncludeInput ditto ;)
org.paternostro.elkromm.emulator.input.1.configuration=NORMALLY_OPEN
